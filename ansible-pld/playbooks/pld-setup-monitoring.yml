---
- name: Configure PLD monitoring
  hosts: "{{ target_hosts | mandatory }}"
  become: true
  gather_facts: true

  tasks:
    - name: PLD monitoring package profile
      ansible.builtin.import_role:
        name: pld_base
        tasks_from: monitoring
      tags: [monitoring_packages, packages]

    - name: PLD NRPE command contract
      ansible.builtin.import_role:
        name: pld_monitoring
      tags: [monitoring]
